/* ---- keep hands/arms outside the torso: nudge the shoulder/elbow until the
   hand clears a cylinder around the spine (greedy, direction-agnostic) ---- */
const _hp = new THREE.Vector3(), _cp = new THREE.Vector3();
const _aq = new THREE.Quaternion(), _ae = new THREE.Euler();
function handRadius(hand){
  hand.updateWorldMatrix(true, false);
  hipsBone.updateWorldMatrix(true, false);
  hand.getWorldPosition(_hp);
  hipsBone.getWorldPosition(_cp);
  return Math.hypot(_hp.x - _cp.x, _hp.z - _cp.z);
}
function nudgeOut(bone, hand, ax, ay, az, step){
  if (!bone) return;
  const before = handRadius(hand);
  const save = bone.quaternion.clone();
  _ae.set(ax*step, ay*step, az*step); _aq.setFromEuler(_ae);
  bone.quaternion.multiply(_aq);
  if (handRadius(hand) <= before + 1e-5){
    bone.quaternion.copy(save);
    _ae.set(-ax*step, -ay*step, -az*step); _aq.setFromEuler(_ae);
    bone.quaternion.multiply(_aq);
    if (handRadius(hand) <= before + 1e-5) bone.quaternion.copy(save);
  }
}
function keepArmsOutside(amount){
  if (!panda || !hipsBone) return;
  const R = panda.userData.torsoClearR || 0;
  if (R <= 0) return;
  const pairs = [[armL, foreL, bone('mixamorigLeftHand')], [armR, foreR, bone('mixamorigRightHand')]];
  for (const [arm, fore, hand] of pairs){
    if (!arm || !hand) continue;
    for (let it = 0; it < 3; it++){
      const need = R - handRadius(hand);
      if (need <= 0) break;
      const step = Math.min(0.30, Math.max(0.06, need * 2.2)) * Math.min(1, amount);
      nudgeOut(arm, hand, 0, 0, 1, step);        // shoulder abduction, outward
      if (R - handRadius(hand) <= 0) break;
      nudgeOut(fore, hand, 1, 0, 0, step * 0.9); // open the elbow
      if (R - handRadius(hand) <= 0) break;
      nudgeOut(arm, hand, 1, 0, 0, step * 0.6);  // swing the whole arm clear
    }
  }
}

/* hard rule for the whole routine: no hand ever rises above neck/shoulder level.
   If one does, rotate the shoulder (then elbow) down until it is back below. */
function keepHandsLow(amount){
  if (!panda) return;
  const refB = bone('mixamorigNeck') || bone('mixamorigSpine2') || spineBone;
  if (!refB) return;
  panda.updateMatrixWorld(true);
  const limitY = refB.getWorldPosition(new THREE.Vector3()).y - modelScale*0.02;
  const pairs = [[armL, foreL, bone('mixamorigLeftHand')], [armR, foreR, bone('mixamorigRightHand')]];
  const hv = new THREE.Vector3();
  for (const [arm, fore, hand] of pairs){
    if (!arm || !hand) continue;
    for (let it = 0; it < 8; it++){
      const over = hand.getWorldPosition(hv).y - limitY;
      if (over <= 0) break;
      const step = Math.min(0.22, Math.max(0.04, over/(modelScale||1)*2.5)) * Math.min(1, Math.max(0.4, amount));
      eTmp.set(step, 0, 0); qTmp.setFromEuler(eTmp);
      arm.quaternion.multiply(qTmp);          // rotate the whole arm down
      arm.updateMatrixWorld(true);
      if (hand.getWorldPosition(hv).y - limitY <= 0) break;
      if (fore){
        eTmp.set(step*0.5, 0, 0); qTmp.setFromEuler(eTmp);
        fore.quaternion.multiply(qTmp);       // soften the elbow too
        fore.updateMatrixWorld(true);
      }
    }
  }
}

/* ---------------- procedural choreography: a real little routine, not a spin ---------------- */

const qTmp = new THREE.Quaternion(), eTmp = new THREE.Euler();
let danceYaw = 0;
function applyDancePose(t, amount){
  if (!panda) return;
  const sc = modelScale/1.6;
  const bps = 124/60;
  const bt = t*bps;                       // beats elapsed
  const w  = bt*Math.PI*2;                // one cycle per beat
  const MOVE_LEN = 8, MOVES = 6;
  const idx   = Math.floor(bt/MOVE_LEN) % MOVES;
  const local = bt - Math.floor(bt/MOVE_LEN)*MOVE_LEN;
  const fade  = Math.min(1, local/0.6, (MOVE_LEN-local)/0.6);
  const k = amount * (0.35 + 0.65*Math.max(0, fade));

  const pose = (b, rx, ry, rz)=>{
    if(!b || !rest.has(b)) return;
    eTmp.set(rx*k, ry*k, rz*k);
    qTmp.setFromEuler(eTmp);
    b.quaternion.copy(rest.get(b)).multiply(qTmp);
  };
  const add = (b, rx, ry, rz)=>{
    if(!b) return;
    eTmp.set(rx*k, ry*k, rz*k); qTmp.setFromEuler(eTmp);
    b.quaternion.multiply(qTmp);
  };

  const upL = bone('mixamorigLeftUpLeg'),  upR = bone('mixamorigRightUpLeg');
  const knL = bone('mixamorigLeftLeg'),    knR = bone('mixamorigRightLeg');
  const ftL = bone('mixamorigLeftFoot'),   ftR = bone('mixamorigRightFoot');
  const handL = bone('mixamorigLeftHand'), handR = bone('mixamorigRightHand');
  const ex = ensureExtraBones() || { tail:[], ears:{L:[],R:[]} };

  const beatPulse = Math.abs(Math.sin(bt*Math.PI));         // 1 pulse per beat
  const halfSway  = Math.sin(bt*Math.PI);                   // 2-beat sway
  let bounce = beatPulse*0.055;
  let yawTurn = 0;

  /* ---- baseline groove every move rides on ---- */
  pose(hipsBone,  0.03*beatPulse, halfSway*0.16, halfSway*0.10);
  pose(spineBone, -0.05 + beatPulse*0.07, -halfSway*0.12, -halfSway*0.06);
  pose(headBone,  -0.04 + Math.sin(w)*0.09, halfSway*0.16, Math.sin(bt*Math.PI+0.6)*0.08);
  pose(upL, 0,0,0); pose(upR, 0,0,0); pose(knL, 0,0,0); pose(knR, 0,0,0);
  pose(armL, -0.35, 0,  0.35); pose(armR, -0.35, 0, -0.35);
  pose(foreL, -0.55, 0, 0);    pose(foreR, -0.55, 0, 0);
  ex.tail.forEach((b,i)=> pose(b, 0, Math.sin(w + i*0.5)*0.22, Math.sin(w*0.5)*0.12));
  ex.ears.L.forEach(b=> pose(b, Math.sin(w)*0.12, 0, 0));
  ex.ears.R.forEach(b=> pose(b, Math.sin(w+1.2)*0.12, 0, 0));

  if (idx === 0){
    /* two-step: weight shifts side to side, knees lift, fists pump on the beat */
    const s = Math.sin(bt*Math.PI);
    add(upL,  Math.max(0, s)*0.55, 0, 0);
    add(knL, -Math.max(0, s)*0.85, 0, 0);
    add(upR,  Math.max(0,-s)*0.55, 0, 0);
    add(knR, -Math.max(0,-s)*0.85, 0, 0);
    add(armL, -0.65 - Math.max(0, s)*0.55, 0, 0.15);
    add(armR, -0.65 - Math.max(0,-s)*0.55, 0, -0.15);
    add(foreL, -0.7, 0, 0); add(foreR, -0.7, 0, 0);
    add(hipsBone, 0, 0, s*0.10);
  } else if (idx === 1){
    /* alternating chest-level punches — never above the shoulders */
    const p = Math.sin(w), q = Math.sin(w + Math.PI);
    add(armL, -0.95 - Math.max(0,p)*0.30, 0, 0.30);
    add(armR, -0.95 - Math.max(0,q)*0.30, 0, -0.30);
    add(foreL, -0.45 + Math.max(0,p)*0.30, 0, 0);
    add(foreR, -0.45 + Math.max(0,q)*0.30, 0, 0);
    add(handL, 0, 0, Math.sin(w*2)*0.35);
    add(handR, 0, 0, -Math.sin(w*2)*0.35);
    add(headBone, -0.12, 0, Math.sin(w)*0.10);
    bounce += beatPulse*0.05;
  } else if (idx === 2){
    /* body roll + shoulder shimmy, hips figure-eight */
    const r = Math.sin(bt*Math.PI*0.5);
    add(hipsBone, Math.sin(w*0.5)*0.10, r*0.22, Math.sin(w)*0.14);
    add(spineBone, -Math.sin(w*0.5+0.9)*0.16, -r*0.18, -Math.sin(w)*0.10);
    add(armL, -0.25, 0, 0.55 + Math.sin(w*2)*0.25);
    add(armR, -0.25, 0, -0.55 - Math.sin(w*2)*0.25);
    add(foreL, -1.0, 0, 0); add(foreR, -1.0, 0, 0);
    add(headBone, Math.sin(w)*0.12, -r*0.18, 0);
  } else if (idx === 3){
    /* one clean turn over the middle of the phrase, arms out like a showman */
    const u = THREE.MathUtils.clamp((local-1.5)/4.0, 0, 1);
    yawTurn = Math.sin(u*Math.PI*2) * 0.45;   // showman twist in place, no full spin
    add(armL, -0.9, 0, 0.9);
    add(armR, -0.9, 0, -0.9);
    add(foreL, -0.35, 0, 0); add(foreR, -0.35, 0, 0);
    add(upL, Math.max(0, Math.sin(bt*Math.PI*2))*0.35, 0, 0);
    add(knL, -Math.max(0, Math.sin(bt*Math.PI*2))*0.5, 0, 0);
    add(headBone, 0, Math.sin(w*0.5)*0.20, 0);
  } else if (idx === 4){
    /* small jumps: tuck the legs, swing the arms, land soft */
    const j = Math.max(0, Math.sin(bt*Math.PI));   // hop every 2 beats
    const air = j*j;
    bounce = air*0.30;
    add(upL, air*0.85, 0, 0.10); add(upR, air*0.85, 0, -0.10);
    add(knL, -air*1.25, 0, 0);   add(knR, -air*1.25, 0, 0);
    add(ftL, air*0.35, 0, 0);    add(ftR, air*0.35, 0, 0);
    add(armL, -1.5*air - 0.3, 0, 0.35*air);
    add(armR, -1.5*air - 0.3, 0, -0.35*air);
    add(spineBone, -0.18*air, 0, 0);
    add(headBone, -0.14*air, 0, 0);
  } else {
    /* running-man footwork with a pointing finger — the crowd-pleaser */
    const s = Math.sin(w);
    add(upL,  s*0.75, 0, 0);   add(knL, -Math.max(0, s)*1.0, 0, 0);
    add(upR, -s*0.75, 0, 0);   add(knR, -Math.max(0,-s)*1.0, 0, 0);
    add(ftL, Math.max(0, s)*0.3, 0, 0); add(ftR, Math.max(0,-s)*0.3, 0, 0);
    add(armR, -1.35 - Math.max(0, s)*0.25, 0, -0.25);
    add(foreR, 0.25, 0, 0);
    add(armL, -0.35 + s*0.35, 0, 0.30);
    add(foreL, -0.9, 0, 0);
    add(spineBone, 0, -s*0.14, 0);
    add(headBone, 0.05, -s*0.18, 0);
    bounce += beatPulse*0.03;
  }

  keepArmsOutside(amount);
  keepHandsLow(amount);

  panda.position.y = (panda.userData.baseY||0) + bounce*amount*sc;


  /* body facing: baseline groove twist plus the turn move */
  danceYaw = (loco.yaw||0) + (halfSway*0.12 + yawTurn)*amount;
  if (panda.userData.uprightQ){
    panda.quaternion.copy(panda.userData.uprightQ);
    eTmp.set(0, danceYaw, 0); qTmp.setFromEuler(eTmp);
    panda.quaternion.premultiply(qTmp);
  }
}



/* ---------------- playful touch reactions (tap paw / body / head / foot) ---------------- */
const bone = n => (panda ? panda.getObjectByName(n) : null);
let touchBones = null;
function ensureTouchBones(){
  if (touchBones || !panda) return touchBones;
  touchBones = {
    head:  [bone('mixamorigHead'), bone('mixamorigNeck')].filter(Boolean),
    body:  [bone('mixamorigSpine1'), bone('mixamorigSpine'), bone('mixamorigHips')].filter(Boolean),
    paw:   [bone('mixamorigLeftHand'), bone('mixamorigRightHand'),
            bone('mixamorigLeftForeArm'), bone('mixamorigRightForeArm')].filter(Boolean),
    foot:  [bone('mixamorigLeftFoot'), bone('mixamorigRightFoot'),
            bone('mixamorigLeftToeBase'), bone('mixamorigRightToeBase')].filter(Boolean),
  };
  [ 'mixamorigLeftHand','mixamorigRightHand','mixamorigLeftUpLeg','mixamorigRightUpLeg',
    'mixamorigLeftLeg','mixamorigRightLeg','mixamorigLeftFoot','mixamorigRightFoot'
  ].forEach(n=>remember(bone(n)));
  return touchBones;
}

/* mouth-movement timing for the replayed recording */

let talkUntil = 0;

/* tiny cartoon "boing" so a tap always feels responsive, even without TTS */
function boing(kind){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  const f0 = kind === 'low' ? 220 : 520;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(kind === 'low' ? 110 : 900, t + 0.18);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.32);
}

/* clear sharp "TAS!" face slap: crisp crack + snappy vocal transient */
function slapSound(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const out = audioCtx.destination;

  /* 1. ultra-sharp attack crack (the "T") */
  const len = 0.07, sr = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, Math.ceil(sr*len), sr);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++){
    const u = i/d.length;
    const env = Math.exp(-u*55) * (u < 0.006 ? u/0.006 : 1);
    d[i] = (Math.random()*2-1) * env;
  }
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const hp = audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 2600;
  const gN = audioCtx.createGain(); gN.gain.value = 0.95;
  src.connect(hp); hp.connect(gN); gN.connect(out);
  src.start(t);

  /* 2. snappy "as" vocal burst */
  const voice = audioCtx.createGain();
  voice.gain.setValueAtTime(0.0001, t);
  voice.gain.exponentialRampToValueAtTime(0.60, t + 0.005);
  voice.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  voice.connect(out);
  const osc = audioCtx.createOscillator(); osc.type='sawtooth';
  osc.frequency.setValueAtTime(560, t);
  osc.frequency.exponentialRampToValueAtTime(390, t + 0.11);
  const f1 = audioCtx.createBiquadFilter(); f1.type='bandpass'; f1.Q=6; f1.frequency.value=1700;
  const f2 = audioCtx.createBiquadFilter(); f2.type='bandpass'; f2.Q=8; f2.frequency.value=2700;
  osc.connect(f1); f1.connect(voice);
  osc.connect(f2); f2.connect(voice);
  osc.start(t); osc.stop(t + 0.14);

  /* 3. flesh thump weight */
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(280, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.10);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.50, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
  o.connect(g); g.connect(out);
  o.start(t); o.stop(t + 0.19);
}

/* short natural "Ugh!" / "Ouch!" grunt right after a hit */
function ughSound(){
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + 0.07;
  const ouch = Math.random() < 0.5;
  const out = audioCtx.destination;
  const voice = audioCtx.createGain();
  voice.gain.setValueAtTime(0.0001, t0);
  voice.gain.exponentialRampToValueAtTime(0.42, t0 + 0.035);
  voice.gain.setValueAtTime(0.42, t0 + (ouch ? 0.20 : 0.13));
  voice.gain.exponentialRampToValueAtTime(0.0001, t0 + (ouch ? 0.40 : 0.30));
  voice.connect(out);

  /* vocal cords: a small pitch fall = a natural pained grunt */
  const f0 = ouch ? 300 : 250;
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(f0*1.08, t0);
  osc.frequency.exponentialRampToValueAtTime(f0*0.72, t0 + (ouch ? 0.36 : 0.26));

  /* two formants shape it into a vowel ("ow" -> "uh") */
  const f1 = audioCtx.createBiquadFilter(); f1.type='bandpass'; f1.Q = 5;
  f1.frequency.setValueAtTime(ouch ? 700 : 560, t0);
  f1.frequency.linearRampToValueAtTime(ouch ? 480 : 500, t0 + 0.28);
  const f2 = audioCtx.createBiquadFilter(); f2.type='bandpass'; f2.Q = 7;
  f2.frequency.setValueAtTime(ouch ? 1150 : 1050, t0);
  f2.frequency.linearRampToValueAtTime(ouch ? 900 : 980, t0 + 0.28);
  const mix = audioCtx.createGain(); mix.gain.value = 0.9;
  osc.connect(f1); f1.connect(mix);
  osc.connect(f2); f2.connect(mix);
  mix.connect(voice);
  osc.start(t0); osc.stop(t0 + 0.45);

  /* breath noise so it sounds like a real mouth, not a synth */
  const bl = 0.22, sr = audioCtx.sampleRate;
  const nb = audioCtx.createBuffer(1, Math.ceil(sr*bl), sr);
  const nd = nb.getChannelData(0);
  for (let i=0;i<nd.length;i++){ const u = i/nd.length; nd[i] = (Math.random()*2-1) * Math.exp(-u*9); }
  const ns = audioCtx.createBufferSource(); ns.buffer = nb;
  const nf = audioCtx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value = 900; nf.Q = 1.2;
  const ng = audioCtx.createGain(); ng.gain.value = 0.12;
  ns.connect(nf); nf.connect(ng); ng.connect(out);
  ns.start(t0);
}

/* clear punch/hit thud for belly & foot taps */
function punchSound(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const out = audioCtx.destination;

  /* low body thud */
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.10);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.85, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g); g.connect(out);
  o.start(t); o.stop(t + 0.20);

  /* contact smack */
  const len = 0.06, sr = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, Math.ceil(sr*len), sr);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++){ const u = i/d.length; d[i] = (Math.random()*2-1) * Math.exp(-u*28); }
  const s = audioCtx.createBufferSource(); s.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 750;
  const g2 = audioCtx.createGain(); g2.gain.value = 0.55;
  s.connect(f); f.connect(g2); g2.connect(out);
  s.start(t);
}

/* cute clear "OUCH!" right after a belly/foot hit */
function ouchSound(){
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + 0.05;
  const out = audioCtx.destination;
  const voice = audioCtx.createGain();
  voice.gain.setValueAtTime(0.0001, t0);
  voice.gain.exponentialRampToValueAtTime(0.55, t0 + 0.025);
  voice.gain.setValueAtTime(0.55, t0 + 0.14);
  voice.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
  voice.connect(out);

  const osc = audioCtx.createOscillator();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(480, t0);
  osc.frequency.exponentialRampToValueAtTime(620, t0 + 0.06);  // "Ow-"
  osc.frequency.exponentialRampToValueAtTime(340, t0 + 0.28);  // "-ch!"

  const f1 = audioCtx.createBiquadFilter(); f1.type='bandpass'; f1.Q = 5;
  f1.frequency.setValueAtTime(900, t0);
  f1.frequency.linearRampToValueAtTime(560, t0 + 0.24);
  const f2 = audioCtx.createBiquadFilter(); f2.type='bandpass'; f2.Q = 7;
  f2.frequency.setValueAtTime(1450, t0);
  f2.frequency.linearRampToValueAtTime(1000, t0 + 0.24);
  const mix = audioCtx.createGain(); mix.gain.value = 0.9;
  osc.connect(f1); f1.connect(mix);
  osc.connect(f2); f2.connect(mix);
  mix.connect(voice);
  osc.start(t0); osc.stop(t0 + 0.36);
}

let reaction = null;   // { kind, t, dur }
function playReaction(kind){
  ensureTouchBones();
  const dur = kind === 'fall' ? 2.6 : 1.1;
  reaction = { kind, t: 0, dur };
  blinkNow();
  if (kind === 'head'){ slapSound(); }                          // face tap: sharp TAS!
  else if (kind === 'fall'){ boing('low'); ughSound(); }         // fall: boing + ugh (old tap sound removed)
  else { punchSound(); ouchSound(); }                           // belly/foot: punch + cute OUCH!
}
window.__pandaReact = playReaction;


const rTmpQ = new THREE.Quaternion(), rTmpE = new THREE.Euler();
function nudge(b, rx, ry, rz){
  if (!b) return;
  rTmpE.set(rx, ry, rz);
  rTmpQ.setFromEuler(rTmpE);
  b.quaternion.multiply(rTmpQ);
}
function applyReactionPose(dt){
  if (!reaction || !panda) return;
  reaction.t += dt;
  const p = reaction.t / reaction.dur;
  if (p >= 1){ reaction = null; panda.position.y = panda.userData.baseY ?? panda.position.y; return; }
  const env = Math.sin(Math.min(1, p) * Math.PI);          // ease in/out
  const wob = Math.sin(reaction.t * 22) * env;
  const k = reaction.kind;

  if (k === 'head'){
    nudge(bone('mixamorigHead'), 0.35*env, wob*0.25, 0);
    nudge(bone('mixamorigSpine1'), -0.18*env, 0, wob*0.06);
    nudge(bone('mixamorigLeftArm'), -0.9*env, 0, 0);
    nudge(bone('mixamorigRightArm'), -0.9*env, 0, 0);
    panda.position.y = (panda.userData.baseY||0) + Math.abs(Math.sin(reaction.t*10))*0.05*env*modelScale/1.6;
  } else if (k === 'body'){
    nudge(bone('mixamorigSpine1'), 0.35*env, wob*0.12, 0);
    nudge(bone('mixamorigHips'), 0.12*env, 0, wob*0.08);
    nudge(bone('mixamorigLeftForeArm'), -1.0*env, 0, 0);
    nudge(bone('mixamorigRightForeArm'), -1.0*env, 0, 0);
    nudge(bone('mixamorigHead'), 0.2*env, 0, wob*0.2);
  } else if (k === 'paw'){
    nudge(bone('mixamorigRightArm'), -1.3*env, 0, 0);
    nudge(bone('mixamorigRightForeArm'), -0.9*env, 0, wob*0.3);
    nudge(bone('mixamorigRightHand'), 0, wob*0.5, 0);
    nudge(bone('mixamorigHead'), -0.1*env, 0.2*env, 0);
    panda.position.y = (panda.userData.baseY||0) + Math.abs(Math.sin(reaction.t*8))*0.06*env*modelScale/1.6;
  } else if (k === 'foot'){
    nudge(bone('mixamorigRightUpLeg'), -0.7*env, 0, 0);
    nudge(bone('mixamorigRightLeg'), 0.9*env, 0, 0);
    nudge(bone('mixamorigSpine1'), -0.15*env, wob*0.15, 0);
    nudge(bone('mixamorigHead'), 0.15*env, wob*0.25, 0);
    panda.position.y = (panda.userData.baseY||0) + Math.abs(Math.sin(reaction.t*9))*0.07*env*modelScale/1.6;
  } else if (k === 'fall'){
    // 0-25% tip over, 25-60% lie down wiggling, 60-100% stand back up
    const down = p < 0.25 ? p/0.25 : p < 0.6 ? 1 : 1 - (p-0.6)/0.4;
    const soft = down*down*(3-2*down);                    // smoothstep: safe, natural
    const tilt = new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.35*soft, 0, 0.18*soft));
    if (panda.userData.uprightQ) panda.quaternion.copy(panda.userData.uprightQ);
    panda.quaternion.multiply(tilt);
    panda.position.y = (panda.userData.baseY||0) - 0.05*soft*modelScale/1.6;
    nudge(bone('mixamorigHead'), 0.5*soft, Math.sin(reaction.t*6)*0.2*soft, 0);
    nudge(bone('mixamorigLeftArm'), -1.1*soft, 0, 0);
    nudge(bone('mixamorigRightArm'), -1.1*soft, 0, 0);
    nudge(bone('mixamorigLeftUpLeg'), -0.5*soft, 0, 0);
    nudge(bone('mixamorigRightUpLeg'), -0.5*soft, 0, 0);
  }
}

/* hit testing: which part of the panda was tapped */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function partAt(clientX, clientY){
  if (!panda) return null;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX - r.left)/r.width)*2 - 1;
  ndc.y = -((clientY - r.top)/r.height)*2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const meshes = [];
  panda.traverse(o=>{ if (o.isMesh) meshes.push(o); });
  const hits = raycaster.intersectObjects(meshes, true);
  if (!hits.length) return null;
  const pt = hits[0].point;
  const groups = ensureTouchBones();
  let best = null, bestD = Infinity;
  const wp = new THREE.Vector3();
  for (const name of ['head','body','paw','foot']){
    for (const b of (groups[name]||[])){
      b.getWorldPosition(wp);
      const d = wp.distanceTo(pt);
      if (d < bestD){ bestD = d; best = name; }
    }
  }
  return best || 'body';
}

let lastTap = 0;
renderer.domElement.style.pointerEvents = 'auto';
renderer.domElement.addEventListener('pointerdown', (ev)=>{
  if (partyMode) return;                              // only the Dance button works while dancing
  const part = partAt(ev.clientX, ev.clientY);

  if (!part) return;
  ensureCtx().catch(()=>{});
  idleSince = performance.now();                    // interaction resets the idle timer
  const now = performance.now();
  if (now - lastTap < 420){ lastTap = 0; playReaction('fall'); return; }  // double tap = funny fall
  lastTap = now;
  playReaction(part);
});

/* ================= grounded locomotion, living idle, breezy leaves =================
   Everything below moves the panda as a real 3D body on the floor plane (y = 0):
   its root travels in world X/Z, the legs take real steps, and its feet only ever
   leave the ground during a short, gravity-driven jump that lands back on y = 0. */

const uni = () => Math.random()*2-1;
const rangeRnd = (a,b) => a + Math.random()*(b-a);

/* pose helper that always starts from the model's own rest pose (rig untouched) */
const gQ = new THREE.Quaternion(), gE = new THREE.Euler();
function poseRest(b, rx, ry, rz){
  if (!b) return;
  remember(b);
  gE.set(rx, ry, rz); gQ.setFromEuler(gE);
  b.quaternion.copy(rest.get(b)).multiply(gQ);
}
function addPose(b, rx, ry, rz){
  if (!b) return;
  gE.set(rx, ry, rz); gQ.setFromEuler(gE);
  b.quaternion.multiply(gQ);
}

const appStart = performance.now();

/* ---- locomotion state ---- */
const loco = {
  x:0, z:0, home:{x:0,z:0}, yaw:0, yawTarget:0,
  speed:0, desired:0, phase:0,
  jumpY:0, jumpV:0, jumps:0,
  state:'idle',            // idle | stroll | return
  target:null,             // THREE.Vector3 ground target
  ready:false,
  legLen:0.62, stride:0.55, soleGap:0, footBones:[],
  nextStroll: 4,
  didSideA:false, didSideB:false, sideTrip:null,
};
const RUN = 1.05, WALK = 0.10;                       // metres / second at modelScale 1.6

/* gait shape: duty = share of the cycle a foot spends planted on the floor */
const GAIT = { hipAmp:0.50, kneeSwing:1.05, kneeStance:0.14, duty:0.62 };
/* rotation signs for this rig (x-axis direction of hip / knee / ankle bones) */
const SH = 1, SK = -1, SA = 1;

function initLoco(){
  if (loco.ready || !panda) return;
  loco.home.x = panda.position.x; loco.home.z = panda.position.z;
  loco.x = loco.home.x; loco.z = loco.home.z;
  ensureTouchBones();
  ['mixamorigLeftUpLeg','mixamorigRightUpLeg','mixamorigLeftLeg','mixamorigRightLeg',
   'mixamorigLeftFoot','mixamorigRightFoot','mixamorigLeftToeBase','mixamorigRightToeBase',
   'mixamorigLeftShoulder','mixamorigRightShoulder',
   'mixamorigSpine','mixamorigSpine1','mixamorigSpine2','mixamorigNeck','mixamorigHead',
   'mixamorigLeftHand','mixamorigRightHand'].forEach(n=>remember(bone(n)));
  collectBlinkTargets();

  /* measure the real leg so the stride length matches the distance travelled */
  const up = bone('mixamorigLeftUpLeg'), kn = bone('mixamorigLeftLeg'), ft = bone('mixamorigLeftFoot');
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  panda.updateWorldMatrix(true, true);
  if (up && kn && ft){
    up.getWorldPosition(a); kn.getWorldPosition(b); ft.getWorldPosition(c);
    loco.legLen = a.distanceTo(b) + b.distanceTo(c);
  }
  /* one step = the horizontal sweep of a straight leg between its two extremes */
  loco.stride = Math.max(0.18, 2 * loco.legLen * Math.sin(GAIT.hipAmp));

  /* which bones touch the floor, and how far the sole sits below the lowest of them */
  loco.footBones = ['mixamorigLeftFoot','mixamorigRightFoot','mixamorigLeftToeBase','mixamorigRightToeBase']
    .map(n=>bone(n)).filter(Boolean);
  let lowest = Infinity;
  for (const fb of loco.footBones){ fb.getWorldPosition(a); lowest = Math.min(lowest, a.y); }
  const box = meshBox(panda);
  loco.soleGap = isFinite(lowest) ? Math.max(0, lowest - box.min.y) : 0;
  loco.groundY = box.min.y;                       // the floor line the feet must stay on

  loco.ready = true;
}

function angleLerp(a, b, t){
  let d = ((b - a + Math.PI) % (Math.PI*2)) - Math.PI;
  if (d < -Math.PI) d += Math.PI*2;
  return a + d*t;
}

function updateLocomotion(dt){
  if (!panda) return;
  initLoco();
  const sc = modelScale/1.6;
  const elapsed = (performance.now() - appStart) / 1000;

  /* the panda stays on its spot: no scheduled side walks */


  let tx = loco.x, tz = loco.z, want = 0;
  if (loco.state === 'return'){
    tx = loco.home.x; tz = loco.home.z;
    want = WALK;
  } else if (loco.state === 'stroll' && loco.target){
    tx = loco.target.x; tz = loco.target.z;
    want = WALK;
  }
  let dx = tx - loco.x, dz = tz - loco.z;
  let dist = Math.hypot(dx, dz);
  const stopAt = 0.06*sc;
  if (dist < stopAt) want = 0;

  if (loco.sideTrip && loco.sideTrip.phase === 'out'){
    loco.sideTrip.timer -= dt;
    if (loco.sideTrip.timer <= 0 || dist < stopAt){
      loco.sideTrip.phase = 'back';
      loco.sideTrip.timer = 8;
      loco.state = 'return';
      loco.target = null;
      tx = loco.home.x; tz = loco.home.z; want = WALK;
      dx = tx - loco.x; dz = tz - loco.z; dist = Math.hypot(dx, dz);
      if (dist < stopAt) want = 0;
    }
  }

  if ((loco.state === 'return' || loco.state === 'stroll') && dist < 0.08*sc){
    if (loco.state === 'return'){ loco.x = loco.home.x; loco.z = loco.home.z; }
    if (loco.sideTrip && loco.sideTrip.phase === 'back') loco.sideTrip = null;
    loco.state = 'idle'; loco.target = null;
    loco.nextStroll = rangeRnd(4, 9);
  }



  loco.desired = want * sc;
  /* accelerate/decelerate gently: weight shifts before the body moves */
  loco.speed += (loco.desired - loco.speed) * Math.min(1, dt*3.2);
  if (loco.speed < 0.01 && loco.desired === 0) loco.speed = 0;

  if (dist > 0.05 && want > 0) loco.yawTarget = Math.atan2(dx, dz);
  else if (loco.state === 'idle') loco.yawTarget = idleYaw;
  loco.yaw = angleLerp(loco.yaw, loco.yawTarget, Math.min(1, dt*3.0));

  if (loco.speed > 0){
    const step = loco.speed*dt;
    loco.x += Math.sin(loco.yaw)*step;
    loco.z += Math.cos(loco.yaw)*step;
    /* stay inside a small courtyard patch so the panda never wanders out of frame */
    const lim = 0.5*sc;
    loco.x = THREE.MathUtils.clamp(loco.x, loco.home.x - lim, loco.home.x + lim);
    loco.z = THREE.MathUtils.clamp(loco.z, loco.home.z - 0.3*sc, loco.home.z + 0.3*sc);
  }

  /* stride phase advances with the real distance travelled: the planted foot
     never slides, because one cycle covers exactly two stride lengths */
  const cycleLen = 2 * loco.stride * (modelScale/1.6);
  if (loco.speed > 0) loco.phase += (loco.speed / cycleLen) * dt * Math.PI*2;
  else {
    /* settle the cycle back to a neutral standing pose instead of freezing mid-step */
    const target = Math.round(loco.phase / (Math.PI*2)) * Math.PI*2;
    loco.phase += (target - loco.phase) * Math.min(1, dt*4);
  }

  /* jump impulses come from the cute idle hop — always start and land on the ground */

  if (loco.jumpV !== 0 || loco.jumpY > 0){
    loco.jumpY += loco.jumpV*dt;
    loco.jumpV -= 6.2*sc*dt;
    if (loco.jumpY <= 0){ loco.jumpY = 0; loco.jumpV = 0; }   // touch down on the floor
  }

  /* horizontal travel only — the height comes from groundFeet() after posing */
  panda.position.x = loco.x;
  panda.position.z = loco.z;

  /* apply body yaw on top of the upright correction (never touches the rig itself) */
  if (panda.userData.uprightQ){
    panda.quaternion.copy(panda.userData.uprightQ);
    gE.set(0, loco.yaw, 0); gQ.setFromEuler(gE);
    panda.quaternion.premultiply(gQ);
  }
}

/* ---- one leg through its cycle: planted for `duty`, swinging for the rest ---- */
const smooth = u => u*u*(3-2*u);
function legAngles(f){
  f -= Math.floor(f);
  const d = GAIT.duty;
  if (f < d){
    /* stance: the foot is on the floor, the body rolls over it heel -> toe */
    const u = f/d;
    return {
      hip:   GAIT.hipAmp*Math.cos(Math.PI*u),           // forward -> backward
      knee:  GAIT.kneeStance*Math.sin(Math.PI*u),       // tiny cushion, never locked straight
      ankle: THREE.MathUtils.lerp(-0.20, 0.34, smooth(u)),  // heel strike -> toe off
      lift:  0,
    };
  }
  /* swing: knee folds, foot clears the floor, leg reaches forward again */
  const u = (f-d)/(1-d);
  return {
    hip:   -GAIT.hipAmp*Math.cos(Math.PI*u),
    knee:  GAIT.kneeSwing*Math.sin(Math.PI*u),
    ankle: THREE.MathUtils.lerp(0.30, -0.20, smooth(u)),
    lift:  Math.sin(Math.PI*u),
  };
}

/* ---- walk / run gait: real weight-shifting steps, feet stay on the floor ---- */
function applyGaitPose(){
  const amp = Math.min(1, loco.speed / (RUN*modelScale/1.6));
  const blend = Math.min(1, loco.speed / (WALK*modelScale/1.6*0.5));
  if (blend < 0.02) return false;
  const f = loco.phase/(Math.PI*2);
  const L = legAngles(f), R = legAngles(f + 0.5);
  const k = blend;

  poseRest(bone('mixamorigLeftUpLeg'),  SH*L.hip*k, 0,  0.04*k);
  poseRest(bone('mixamorigRightUpLeg'), SH*R.hip*k, 0, -0.04*k);
  poseRest(bone('mixamorigLeftLeg'),    SK*L.knee*k, 0, 0);
  poseRest(bone('mixamorigRightLeg'),   SK*R.knee*k, 0, 0);
  poseRest(bone('mixamorigLeftFoot'),   SA*L.ankle*k, 0, 0);
  poseRest(bone('mixamorigRightFoot'),  SA*R.ankle*k, 0, 0);

  /* arms counter-swing the legs, elbows keep a soft natural bend */
  poseRest(armL,  (-0.12 + SH*R.hip*0.55)*k, 0,  0.10*k);
  poseRest(armR,  (-0.12 + SH*L.hip*0.55)*k, 0, -0.10*k);
  poseRest(foreL, (-0.30 - Math.max(0, SH*R.hip)*0.35)*k, 0, 0);
  poseRest(foreR, (-0.30 - Math.max(0, SH*L.hip)*0.35)*k, 0, 0);

  /* pelvis drops onto the loaded leg, torso counter-rotates, head stays level */
  const sway = Math.sin(loco.phase);
  poseRest(hipsBone, 0.02*amp, sway*0.10*k, sway*0.07*k);
  poseRest(spineBone, (0.05 + 0.06*amp) + Math.sin(loco.phase*2)*0.02*k, -sway*0.09*k, -sway*0.03*k);
  poseRest(headBone, -0.03*amp, -sway*0.04*k, 0);
  return true;
}

/* ---- keep the soles exactly on the floor line, every single frame ---- */
const gV = new THREE.Vector3();
function groundFeet(){
  if (!panda || !loco.ready || !loco.footBones.length) return;
  panda.updateMatrixWorld(true);
  let lowest = Infinity;
  for (const fb of loco.footBones){ fb.getWorldPosition(gV); lowest = Math.min(lowest, gV.y); }
  if (!isFinite(lowest)) return;
  const sole = lowest - loco.soleGap;                 // world Y of the lowest sole
  const wanted = (loco.groundY || 0) + loco.jumpY;    // floor, plus any airborne offset
  panda.position.y += wanted - sole;
  panda.updateMatrixWorld(true);
}

/* ---- blinking (uses the model's own eye morphs when it has them) ---- */
let blinkTargets = [], blinkT = 1, nextBlink = 2;
function collectBlinkTargets(){
  blinkTargets = [];
  if (!panda) return;
  panda.traverse(o=>{
    if (!o.isMesh || !o.morphTargetDictionary) return;
    for (const name in o.morphTargetDictionary){
      if (/blink|eyeclose|eyes_close|closeeye/i.test(name))
        blinkTargets.push({ mesh:o, idx:o.morphTargetDictionary[name] });
    }
  });
}
function blinkNow(){ blinkT = 0; }
function updateBlink(dt){
  nextBlink -= dt;
  if (nextBlink <= 0){ blinkNow(); nextBlink = rangeRnd(2.2, 6.5); }
  if (blinkT < 1){
    blinkT = Math.min(1, blinkT + dt*7);
    const v = Math.sin(blinkT*Math.PI);
    blinkTargets.forEach(b=>{ if (b.mesh.morphTargetInfluences) b.mesh.morphTargetInfluences[b.idx] = v; });
    return v;
  }
  blinkTargets.forEach(b=>{ if (b.mesh.morphTargetInfluences) b.mesh.morphTargetInfluences[b.idx] = 0; });
  return 0;
}

/* ---- living idle: breathing, head turns, tail wag, ear flicks, little hops ---- */
let idleT = 0, idleYaw = 0, lookYaw = 0, lookYawTarget = 0, nextLook = 3;
let quirk = null, nextQuirk = 3;
const QUIRKS = [
  'tailWag','tailWag','headShake','headShake','earFlick','blink','blink',
  'scratchBelly','scratchEar','scratchHead','wave','wave','stretch','wiggle'
];


/* find the rig's tail / ear bones once, whatever naming the model uses */
let extraBones = null;
function ensureExtraBones(){
  if (extraBones || !panda) return extraBones;
  const tail = [], ears = { L: [], R: [] };
  panda.traverse(o=>{
    if (!o.isBone && !/Bone/i.test(o.type||'')) return;
    const n = o.name || '';
    if (/tail/i.test(n)) tail.push(o);
    else if (/ear/i.test(n)){
      if (/left|_l\b|l$|\.l$/i.test(n)) ears.L.push(o);
      else if (/right|_r\b|r$|\.r$/i.test(n)) ears.R.push(o);
      else ears.L.push(o);
    }
  });
  tail.forEach(remember);
  ears.L.forEach(remember); ears.R.forEach(remember);
  extraBones = { tail, ears };
  return extraBones;
}

function updateIdleBehaviour(dt){
  idleT += dt;
  nextLook -= dt;
  if (nextLook <= 0){ lookYawTarget = uni()*0.45; nextLook = rangeRnd(2.5, 6); }
  lookYaw += (lookYawTarget - lookYaw) * Math.min(1, dt*1.6);

  nextQuirk -= dt;
  if (!quirk && nextQuirk <= 0 && loco.state === 'idle' && !reaction && loco.speed === 0){
    const kind = QUIRKS[(Math.random()*QUIRKS.length)|0];
    quirk = { kind, t:0, dur: rangeRnd(1.0, 1.8), fired:false };
    if (kind === 'blink'){ blinkNow(); }
    nextQuirk = rangeRnd(1.6, 4.0);
  }

  if (quirk){
    quirk.t += dt;
    if (quirk.t >= quirk.dur) quirk = null;
  }

}

function applyIdlePose(){
  const t = idleT;
  const breath = Math.sin(t*1.15);
  poseRest(spineBone, breath*0.035, Math.sin(t*0.42)*0.05, Math.sin(t*0.27)*0.03);
  poseRest(hipsBone, 0, Math.sin(t*0.33)*0.04, Math.sin(t*0.5)*0.02);
  poseRest(headBone, Math.sin(t*0.7)*0.05 - 0.02, lookYaw + Math.sin(t*0.9)*0.05, Math.sin(t*0.6)*0.05);
  poseRest(armL, -0.06 + breath*0.05, 0, 0.05 + Math.sin(t*0.8)*0.05);
  poseRest(armR, -0.06 + breath*0.05, 0, -0.05 - Math.sin(t*0.75+1.1)*0.05);
  poseRest(foreL, -0.1 + Math.sin(t*0.9)*0.05, 0, 0);
  poseRest(foreR, -0.1 + Math.sin(t*0.85+0.7)*0.05, 0, 0);
  poseRest(bone('mixamorigLeftUpLeg'), 0, 0, 0);
  poseRest(bone('mixamorigRightUpLeg'), 0, 0, 0);
  poseRest(bone('mixamorigLeftLeg'), 0, 0, 0);
  poseRest(bone('mixamorigRightLeg'), 0, 0, 0);

  /* gentle resting life in the tail and ears, whatever the rig calls them */
  const ex = ensureExtraBones() || { tail:[], ears:{L:[],R:[]} };
  ex.tail.forEach((b,i)=> poseRest(b, 0, Math.sin(t*1.3 + i*0.5)*0.06, Math.sin(t*1.1 + i*0.4)*0.05));
  ex.ears.L.forEach((b,i)=> poseRest(b, Math.sin(t*1.7 + i*0.3)*0.05, 0, Math.sin(t*1.4)*0.04));
  ex.ears.R.forEach((b,i)=> poseRest(b, Math.sin(t*1.7 + 1.2 + i*0.3)*0.05, 0, -Math.sin(t*1.4+0.6)*0.04));

  /* fallback ear bones from the mixamo-style naming */
  const earL = bone('mixamorigLeftEar') || bone('ear_L') || bone('EarL');
  const earR = bone('mixamorigRightEar') || bone('ear_R') || bone('EarR');
  poseRest(earL, Math.sin(t*2.1)*0.09, 0, 0);
  poseRest(earR, Math.sin(t*2.1+1.4)*0.09, 0, 0);

  if (!quirk) return;
  const e = Math.sin(Math.min(1, quirk.t/quirk.dur) * Math.PI);   // ease in / out
  const w = Math.sin(quirk.t*11);
  if (quirk.kind === 'tailWag'){
    const wag = Math.sin(quirk.t*9);
    ex.tail.forEach((b,i)=> addPose(b, 0, wag*0.30*e/(1+i*0.35), Math.sin(quirk.t*9 + i*0.6)*0.12*e));
    addPose(hipsBone, 0, wag*0.05*e, 0);
    addPose(headBone, 0.04*e, wag*0.05*e, 0);
  } else if (quirk.kind === 'headShake'){
    const shake = Math.sin(quirk.t*7.5);
    addPose(headBone, Math.sin(quirk.t*3.4)*0.10*e, shake*0.26*e, Math.sin(quirk.t*5)*0.10*e);
    addPose(bone('mixamorigNeck'), 0, shake*0.10*e, 0);
    addPose(spineBone, 0, shake*0.04*e, 0);
  } else if (quirk.kind === 'earFlick'){
    const f1 = Math.sin(quirk.t*13), f2 = Math.sin(quirk.t*13 + 1.9);
    ex.ears.L.forEach(b=> addPose(b, f1*0.30*e, 0, f1*0.16*e));
    ex.ears.R.forEach(b=> addPose(b, f2*0.30*e, 0, -f2*0.16*e));
    addPose(earL, f1*0.30*e, 0, 0);
    addPose(earR, f2*0.30*e, 0, 0);
    addPose(headBone, Math.sin(quirk.t*6)*0.06*e, 0, Math.sin(quirk.t*8)*0.06*e);
  } else if (quirk.kind === 'blink'){
    /* a soft double blink with a tiny head bob */
    addPose(headBone, Math.sin(quirk.t*4)*0.05*e, 0, Math.sin(quirk.t*3)*0.04*e);
    if (!quirk.fired && quirk.t > 0.45){ quirk.fired = true; blinkNow(); }
  } else if (quirk.kind === 'wave'){
    /* raise one paw and wave it, keeping both feet planted */
    addPose(armR, -1.35*e, 0, -0.35*e);
    addPose(foreR, -0.75*e, 0, w*0.35*e);
    addPose(bone('mixamorigRightHand'), 0, 0, w*0.30*e);
    addPose(headBone, -0.06*e, -0.10*e, 0);
    addPose(spineBone, -0.03*e, -0.04*e, 0);
  } else if (quirk.kind === 'scratchEar'){
    addPose(armL, -1.05*e, 0, 0.75*e);
    addPose(foreL, -1.25*e, 0, 0);
    addPose(bone('mixamorigLeftHand'), w*0.45*e, 0, 0);
    ex.ears.L.forEach(b=> addPose(b, Math.sin(quirk.t*10)*0.16*e, 0, 0));
    addPose(earL, Math.sin(quirk.t*10)*0.16*e, 0, 0);
    addPose(headBone, 0.05*e, 0.10*e, 0.16*e);

  } else if (quirk.kind === 'scratchBelly'){
    addPose(armR, -0.55*e, 0, -0.5*e);
    addPose(foreR, -1.5*e, 0, 0.25*e);
    addPose(bone('mixamorigRightHand'), w*0.35*e, 0, 0);
    addPose(headBone, 0.18*e, -0.12*e, 0);
  } else if (quirk.kind === 'scratchHead'){
    addPose(armL, -1.25*e, 0, 0.55*e);
    addPose(foreL, -1.5*e, 0, 0);
    addPose(bone('mixamorigLeftHand'), w*0.4*e, 0, 0);
    addPose(headBone, -0.12*e, 0.14*e, w*0.05*e);
  } else if (quirk.kind === 'stretch'){
    addPose(armL, -1.0*e, 0, 0.3*e);
    addPose(armR, -1.0*e, 0, -0.3*e);
    addPose(spineBone, -0.16*e, 0, 0);
    addPose(headBone, -0.2*e, 0, 0);
  } else {  /* wiggle: cute little body reaction */
    addPose(hipsBone, 0, Math.sin(quirk.t*7)*0.16*e, Math.sin(quirk.t*9)*0.06*e);
    addPose(spineBone, 0, Math.sin(quirk.t*7+0.8)*0.12*e, 0);
    addPose(headBone, 0.08*e, Math.sin(quirk.t*7+1.6)*0.14*e, 0);
  }
}


/* ---- soft breeze through individual 3D leaves (background itself never moves) ---- */
const leafGroup = new THREE.Group(); scene.add(leafGroup);
const leaves = [];
function leafShape(){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(0.09, 0.05, 0.10, 0.20, 0, 0.30);
  s.bezierCurveTo(-0.10, 0.20, -0.09, 0.05, 0, 0);
  return new THREE.ShapeGeometry(s, 10);
}
function buildLeaves(){
  if (leaves.length || !panda) return;
  const geo = leafShape();
  const sc = modelScale/1.6;
  const spanY = camBase.y + 1.5*sc;                // just above the panda, top of frame
  const mats = [0x3f7d34, 0x4f9440, 0x2f6b2d, 0x63a94c].map(c =>
    new THREE.MeshStandardMaterial({ color:c, roughness:0.75, metalness:0.02, side:THREE.DoubleSide }));

  for (let i=0;i<26;i++){
    const side = i % 2 ? 1 : -1;
    const vine = new THREE.Group();
    const x = side * rangeRnd(0.9, 2.1) * sc;
    const y = spanY - rangeRnd(0.0, 1.5) * sc;
    const z = rangeRnd(0.4, 1.9) * sc;
    vine.position.set(x, y, z);
    const leaf = new THREE.Mesh(geo, mats[i % mats.length]);
    leaf.scale.setScalar(rangeRnd(0.7, 1.5) * sc);
    leaf.rotation.set(rangeRnd(-0.5,0.5), rangeRnd(-Math.PI,Math.PI), rangeRnd(-2.6,-0.6));
    vine.add(leaf);
    leafGroup.add(vine);
    leaves.push({
      vine, leaf,
      base: vine.rotation.clone(),
      leafBase: leaf.rotation.clone(),
      sp: rangeRnd(0.25, 0.65),      // its own slow rhythm
      ph: Math.random()*Math.PI*2,
      amp: rangeRnd(0.06, 0.20),
    });
  }
}
function updateLeaves(t){
  const breeze = 0.6 + 0.4*Math.sin(t*0.19) + 0.2*Math.sin(t*0.53+1.3);   // gentle gusts
  for (const L of leaves){
    const a = t*L.sp + L.ph;
    L.vine.rotation.set(
      L.base.x + Math.sin(a)*L.amp*breeze*0.5,
      L.base.y + Math.sin(a*0.7+0.6)*L.amp*breeze*0.4,
      L.base.z + Math.sin(a*1.1)*L.amp*breeze
    );
    L.leaf.rotation.set(
      L.leafBase.x + Math.sin(a*1.7)*L.amp*breeze*0.8,
      L.leafBase.y + Math.sin(a*1.3+1.1)*L.amp*breeze*0.7,
      L.leafBase.z + Math.sin(a*2.1+0.4)*L.amp*breeze*0.5
    );
  }
}

/* ---------------- 🎈 balloon popping (only after the balloon button is tapped) ---------------- */
const balloonBtn = document.getElementById('balloonBtn');
let balloonOn = false, balloonT = 0, balloonBlend = 0;
let balloons = [], bursts = [], pinGroup = null, popCycle = 0, popArmed = false;
const BALLOON_COUNT = 5;
const POP_PERIOD = 1.15;
const BALLOON_COLORS = [0xff3b6b, 0xffc531, 0x3bc9ff, 0x7be06a, 0xc06bff, 0xff8a3b];

function makeBalloon(i){
  const sc = modelScale/1.6;
  const g = new THREE.Group();
  const col = BALLOON_COLORS[(Math.random()*BALLOON_COLORS.length)|0];
  const skin = new THREE.MeshStandardMaterial({ color: col, roughness:0.28, metalness:0.02 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.15*sc, 26, 20), skin);
  body.scale.set(1, 1.18, 1);
  body.position.y = 0.15*sc;
  const knot = new THREE.Mesh(new THREE.ConeGeometry(0.034*sc, 0.055*sc, 10), skin);
  knot.rotation.x = Math.PI;
  const string = new THREE.Mesh(
    new THREE.CylinderGeometry(0.003*sc, 0.003*sc, 0.26*sc, 5),
    new THREE.MeshStandardMaterial({ color:0xf7f2e8, roughness:0.9 })
  );
  string.position.y = -0.15*sc;
  g.add(body, knot, string);
  scene.add(g);
  const slot = (i % BALLOON_COUNT);
  return {
    group: g, col,
    ang: (slot/BALLOON_COUNT)*Math.PI*2 + Math.random()*0.5,
    spin: 0.5 + Math.random()*0.5,
    rx: 0.42 + Math.random()*0.18,
    ry: 0.20 + Math.random()*0.10,
    baseY: 0.62 + Math.random()*0.22,
    bob: Math.random()*Math.PI*2,
    born: 0, popped: false
  };
}

function makePin(){
  const sc = modelScale/1.6;
  pinGroup = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({ color:0xdfe6ee, roughness:0.25, metalness:0.85 });
  const needle = new THREE.Mesh(new THREE.CylinderGeometry(0.009*sc, 0.0015*sc, 0.34*sc, 8), steel);
  needle.position.y = 0.17*sc;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.045*sc, 14, 12),
    new THREE.MeshStandardMaterial({ color:0xff3b6b, roughness:0.3 }));
  pinGroup.add(needle, head);
  pinGroup.visible = false;
  scene.add(pinGroup);
}

function popSound(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime, out = audioCtx.destination;
  /* body: short pitch-dropping sine "thock" */
  const o = audioCtx.createOscillator(), og = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(760 + Math.random()*180, t);
  o.frequency.exponentialRampToValueAtTime(120, t + 0.07);
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.5, t + 0.004);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.10);
  o.connect(og).connect(out); o.start(t); o.stop(t + 0.12);
  /* burst: filtered noise crack */
  const n = 0.09, buf = audioCtx.createBuffer(1, (audioCtx.sampleRate*n)|0, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 3);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.9;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.55, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  src.connect(bp).connect(ng).connect(out); src.start(t); src.stop(t + n);
}

function spawnBurst(pos, col){
  const sc = modelScale/1.6;
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness:0.5, side: THREE.DoubleSide });
  const bits = [];
  for (let i=0;i<10;i++){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.05*sc, 0.05*sc), mat);
    m.position.set(0,0,0);
    g.add(m);
    bits.push({ m, v: new THREE.Vector3((Math.random()-0.5)*1.6, Math.random()*1.4, (Math.random()-0.5)*1.2).multiplyScalar(sc) });
  }
  g.position.copy(pos);
  scene.add(g);
  bursts.push({ g, bits, t: 0, mat });
}

function clearBalloons(){
  balloons.forEach(b => scene.remove(b.group));
  balloons = [];
  bursts.forEach(b => scene.remove(b.g));
  bursts = [];
}

function pinTipWorld(){
  const v = new THREE.Vector3(0, (modelScale/1.6)*0.35, 0);
  if (pinGroup) pinGroup.localToWorld(v);
  return v;
}

function updateBalloon(dt){
  balloonBlend += ((balloonOn ? 1 : 0) - balloonBlend) * Math.min(1, dt*3.6);
  if (!balloonOn && balloonBlend < 0.02 && balloons.length){ clearBalloons(); }
  if (pinGroup) pinGroup.visible = balloonBlend > 0.02;

  const sc = modelScale/1.6;
  balloonT += dt;

  /* pin rides in the right paw */
  if (pinGroup && panda){
    const hand = bone('mixamorigRightHand') || bone('mixamorigRightForeArm');
    if (hand){
      hand.getWorldPosition(pinGroup.position);
      hand.getWorldQuaternion(pinGroup.quaternion);
      pinGroup.rotateX(-1.15);
      pinGroup.scale.setScalar(Math.max(0.001, balloonBlend));
    }
  }

  /* bursts */
  for (let i = bursts.length - 1; i >= 0; i--){
    const b = bursts[i];
    b.t += dt;
    b.bits.forEach(p => {
      p.v.y -= 3.2*sc*dt;
      p.m.position.addScaledVector(p.v, dt);
      p.m.rotation.x += dt*6; p.m.rotation.y += dt*5;
    });
    b.mat.opacity = Math.max(0, 1 - b.t/0.6); b.mat.transparent = true;
    if (b.t > 0.6){ scene.remove(b.g); bursts.splice(i,1); }
  }

  if (!balloonOn) return;

  /* keep the flock topped up */
  while (balloons.length < BALLOON_COUNT) balloons.push(makeBalloon(balloons.length));

  /* the panda jabs on a steady beat; the pop lands at the top of the jab */
  popCycle += dt / POP_PERIOD;
  if (popCycle >= 1){ popCycle -= 1; popArmed = true; }
  const jab = Math.max(0, Math.sin(popCycle*Math.PI*2 - Math.PI*0.5));

  /* the first balloon in the flock is the current victim: it drifts onto the pin */
  const tip = pinTipWorld();
  balloons.forEach((b, i) => {
    b.born = Math.min(1, b.born + dt*3);
    const target = (i === 0);
    b.bob += dt;
    let x, y, z;
    if (target){
      const app = Math.min(1, 0.25 + popCycle*1.1);
      const hx = loco.x + Math.cos(b.ang)*b.rx*sc, hy = b.baseY*sc, hz = loco.z + (0.95 + Math.sin(b.ang)*0.10)*sc;
      x = hx + (tip.x - hx)*app;
      y = hy + (tip.y - hy)*app + Math.sin(b.bob*2)*0.012*sc;
      z = hz + (tip.z - hz)*app;
    } else {
      b.ang += dt*b.spin*0.6;
      x = loco.x + Math.cos(b.ang)*b.rx*sc;
      y = (b.baseY + Math.sin(b.bob*1.4)*0.05)*sc;
      z = loco.z + (0.95 + Math.sin(b.ang)*b.ry*0.6)*sc;
    }
    b.group.position.set(x, y, z);
    b.group.rotation.z = Math.sin(b.bob*1.2)*0.10;
    b.group.scale.setScalar(Math.max(0.001, balloonBlend * b.born));
  });

  /* POP! */
  if (popArmed && jab > 0.92 && balloons.length){
    const v = balloons.shift();
    scene.remove(v.group);
    spawnBurst(v.group.position, v.col);
    popSound();
    popArmed = false;
    balloons.push(makeBalloon(balloons.length));
  }
}

/* panda stays standing and jabs the pin at the balloons */
function applyBalloonPose(){
  if (balloonBlend < 0.01) return;
  const k = balloonBlend;
  const t = balloonT;
  const jab = Math.max(0, Math.sin(popCycle*Math.PI*2 - Math.PI*0.5));

  /* standing: only a light lean and shoulder twist into each jab */
  addPose(hipsBone, 0.03*k*jab, -0.05*k*jab, 0);
  addPose(spineBone, 0.07*k*jab, -0.10*k*jab, 0);

  /* right paw holds the pin and thrusts forward, left paw balances */
  addPose(armR, (-1.00 - jab*0.45)*k, -0.20*k, -0.40*k);
  addPose(foreR, (-1.05 + jab*0.70)*k, 0, 0);
  addPose(bone('mixamorigRightHand'), -0.25*k, 0, 0);
  addPose(armL, (-0.60 - Math.sin(t*1.6)*0.10)*k, 0, 0.36*k);
  addPose(foreL, -0.70*k, 0, 0);

  /* head tracks the next balloon */
  addPose(headBone, (-0.14 - jab*0.10)*k, (-0.10 + Math.sin(t*1.1)*0.08)*k, 0);
}

function toggleBalloon(){
  ensureCtx().catch(()=>{});
  if (!pinGroup) makePin();
  balloonOn = !balloonOn;
  clearBalloons();
  if (balloonOn){ balloonT = 0; popCycle = 0; popArmed = true; }
  else if (pinGroup) pinGroup.visible = false;
  balloonBtn.setAttribute('aria-pressed', String(balloonOn));
  balloonBtn.title = balloonOn ? 'Stop popping balloons' : 'Pop some balloons';
  idleSince = performance.now();
}
balloonBtn.addEventListener('click', toggleBalloon);


/* ---- idle bookkeeping ---- */
let idleSince = performance.now();




/* ---------------- start gate (user gesture required on Android) ---------------- */
// Panda is shown immediately; audio is started automatically and falls back to a
// toast if the browser still needs a user gesture.
gateEl.style.display = 'none';
tryStartAudio();

/* ---------------- loop ---------------- */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();

  if (mixer && partyMode) mixer.update(dt);   // clip playback only during the party
  vad(now);

  /* party blend for lights + camera motion */
  const target = partyMode ? 1 : 0;
  partyBlend += (target - partyBlend) * Math.min(1, dt*2.2);
  if (!partyMode && partyBlend < 0.02) partyBlend = 0;

  if (partyBlend > 0.001){
    danceTime += dt;
    const t = danceTime;
    spots.forEach((s,i)=>{
      const a = t*(0.9 + i*0.25) + i*1.7;
      s.position.set(Math.cos(a)*3.4, 3.6 + Math.sin(a*1.3)*0.6, Math.sin(a)*3.0 + 1.8);
      s.target.position.set(Math.sin(a*0.7)*0.5, 0.8 + Math.sin(a*2)*0.3, 0);
      s.target.updateMatrixWorld();
      s.intensity = (16 + 10*Math.abs(Math.sin(t*3.2 + i))) * partyBlend;
    });
    partyAmbient.intensity = 0.55 * partyBlend;
  } else {
    spots.forEach(s=>s.intensity=0);
    partyAmbient.intensity = 0;
  }
  hemi.intensity = 2.2 - 1.5*partyBlend;
  key.intensity  = 2.0 - 1.6*partyBlend;
  fill.intensity = 0.9 - 0.7*partyBlend;

  if (panda){
    initLoco();
    const partying = partyBlend > 0.01;
    /* always rebuild the pose from the rig's own rest pose */
    rest.forEach((q,b)=> b.quaternion.copy(q));

    if (partying){
      if (panda.userData.uprightQ) panda.quaternion.copy(panda.userData.uprightQ);
      panda.position.set(loco.home.x, panda.userData.baseY ?? panda.position.y, loco.home.z);
      applyDancePose(danceTime, partyBlend);
      updateBlink(dt);
      if (reaction) applyReactionPose(dt);
    } else {
      updateIdleBehaviour(dt);
      updateLocomotion(dt);                  // yaw only (height handled by groundFeet)
      applyIdlePose();                       // breathing, look-around, quirks
      applyGaitPose();                       // steps, on top of the idle pose
      applyBalloonPose();                    // sit + play, only while the balloon is out

      updateBlink(dt);
      if (reaction) applyReactionPose(dt);   // taps own the body pose while they last
      groundFeet();                          // soles always locked to the floor line
    }

    buildSwag();
    panda.updateMatrixWorld(true);
    updateSwag(partyBlend);                  // chain + shades follow the neck and face
    buildLeaves();
  }

  updateLeaves(clock.elapsedTime);
  updateBalloon(dt);

  

  /* subtle cinematic camera drift during the party */
  if (camBase.lengthSq()){
    const s = partyBlend;
    camera.position.set(
      camBase.x + Math.sin(danceTime*0.55)*0.28*s,
      camBase.y + Math.sin(danceTime*0.9)*0.07*s,
      camBase.z + Math.sin(danceTime*0.4)*0.20*s
    );
    camera.lookAt(Math.sin(danceTime*0.5)*0.06*s, camLookY, 0);
  }

  if (window.__poseHook) window.__poseHook();
  renderer.render(scene, camera);
}
tick();
</script>

<script>
(function(){
  var bg=document.getElementById('bg'), frame=document.getElementById('photoFrame');
  var IW=900, IH=1512;
  // Frame rect in background-image fractions: left/top/width/height.
  // Sits on the brick wall between the window and the hanging vines.
  var R={l:0.2389, t:0.1587, w:0.2222, h:0.1653};
  function layout(){
    var app=document.getElementById('app');
    var cw=app.clientWidth, ch=app.clientHeight;
    var scale=Math.max(cw/IW, ch/IH);
    var dw=IW*scale, dh=IH*scale;
    var ox=(cw-dw)/2, oy=(ch-dh)/2;
    frame.style.display='block';
    frame.style.left=(ox+R.l*dw)+'px';
    frame.style.top=(oy+R.t*dh)+'px';
    frame.style.width=(R.w*dw)+'px';
    frame.style.height=(R.h*dh)+'px';
  }
  window.addEventListener('resize',layout);
  if(bg.complete) layout(); else bg.addEventListener('load',layout);
  layout();
})();
</script>
