<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Talking Panda 🐼</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;
 background:#000;font-family:"Segoe UI",Roboto,system-ui,sans-serif;position:fixed;inset:0;touch-action:manipulation}
#app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#000}

#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block;
 transition:filter 900ms ease}
body.party #bg{filter:brightness(.34) saturate(1.25) hue-rotate(-12deg)}

/* ---- party atmosphere overlays (pure CSS, only visible in party mode) ---- */
#night{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 900ms ease;
 background:radial-gradient(120% 80% at 50% 0%,rgba(80,20,160,.55),rgba(4,2,20,.85) 70%)}
body.party #night{opacity:1}

#beams{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 900ms ease;mix-blend-mode:screen;overflow:hidden}
body.party #beams{opacity:1}
.beam{position:absolute;top:-28%;left:50%;width:26vw;height:130%;transform-origin:50% 0%;
 filter:blur(10px);opacity:.55;
 background:linear-gradient(to bottom,rgba(255,255,255,.85),rgba(255,255,255,0) 78%)}
.beam.b1{background:linear-gradient(to bottom,rgba(255,60,160,.9),rgba(255,60,160,0) 78%);animation:sweepA 4.6s ease-in-out infinite alternate}
.beam.b2{background:linear-gradient(to bottom,rgba(60,180,255,.9),rgba(60,180,255,0) 78%);animation:sweepB 5.8s ease-in-out infinite alternate}
.beam.b3{background:linear-gradient(to bottom,rgba(150,90,255,.9),rgba(150,90,255,0) 78%);animation:sweepC 3.9s ease-in-out infinite alternate}
.beam.b4{background:linear-gradient(to bottom,rgba(90,255,190,.8),rgba(90,255,190,0) 78%);animation:sweepD 6.6s ease-in-out infinite alternate}
@keyframes sweepA{from{transform:translateX(-50%) rotate(-34deg)}to{transform:translateX(-50%) rotate(24deg)}}
@keyframes sweepB{from{transform:translateX(-50%) rotate(30deg)}to{transform:translateX(-50%) rotate(-26deg)}}
@keyframes sweepC{from{transform:translateX(-50%) rotate(-14deg)}to{transform:translateX(-50%) rotate(40deg)}}
@keyframes sweepD{from{transform:translateX(-50%) rotate(18deg)}to{transform:translateX(-50%) rotate(-38deg)}}

#floorglow{position:absolute;left:-10%;right:-10%;bottom:-6%;height:38%;pointer-events:none;opacity:0;
 transition:opacity 900ms ease;mix-blend-mode:screen;filter:blur(18px);
 background:
  radial-gradient(40% 60% at 20% 60%,rgba(255,60,160,.55),transparent 70%),
  radial-gradient(40% 60% at 50% 70%,rgba(90,150,255,.55),transparent 70%),
  radial-gradient(40% 60% at 80% 60%,rgba(150,255,200,.45),transparent 70%);
 animation:floorPulse 2.4s ease-in-out infinite alternate}
body.party #floorglow{opacity:1}
@keyframes floorPulse{from{transform:translateY(6px) scaleX(.96);opacity:.75}to{transform:translateY(-4px) scaleX(1.04);opacity:1}}

#panda-layer{position:absolute;inset:0}
#panda-layer canvas{display:block;width:100%;height:100%;touch-action:manipulation}

#title{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:5;pointer-events:none;
 font-size:clamp(22px,7vw,40px);font-weight:800;letter-spacing:.5px;color:#fff;
 text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.35)}

#dock{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));z-index:7;
 display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#hint{color:#fff;font-size:13px;font-weight:600;text-shadow:0 2px 6px rgba(0,0,0,.6);opacity:.9;text-align:center;padding:0 18px}
#dance{pointer-events:auto;border:0;cursor:pointer;font:inherit;font-size:17px;font-weight:800;color:#fff;
 padding:14px 30px;border-radius:999px;letter-spacing:.3px;
 background:linear-gradient(135deg,#ff3ea5,#8b5cf6 55%,#2dd4ff);
 box-shadow:0 10px 26px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.35);
 transition:transform 160ms ease,box-shadow 260ms ease,filter 260ms ease}
#dance:active{transform:scale(.95)}

/* 🎈 balloon button — right edge, vertically centred */
#balloonBtn{position:absolute;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);
 z-index:7;pointer-events:auto;border:0;cursor:pointer;font:inherit;font-size:26px;line-height:1;
 width:58px;height:58px;border-radius:999px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.12));
 border:2px solid rgba(255,255,255,.42);backdrop-filter:blur(4px);
 box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform 160ms ease,box-shadow 240ms ease}
#balloonBtn:active{transform:translateY(-50%) scale(.92)}
#balloonBtn[aria-pressed="true"]{box-shadow:0 0 0 3px rgba(255,59,107,.55),0 10px 26px rgba(255,59,107,.45)}

body.party #dance{box-shadow:0 0 0 3px rgba(255,255,255,.18),0 12px 34px rgba(255,62,165,.6);filter:saturate(1.2)}

#gate{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:24px;
 background:rgba(0,0,0,.6);color:#fff;text-align:center;backdrop-filter:blur(2px)}
#gate .card{max-width:340px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);
 border-radius:22px;padding:22px 22px 18px}
#gate h2{margin:0 0 8px;font-size:21px}
#gate p{margin:0 0 16px;font-size:14px;line-height:1.45;opacity:.92}
#gate button{border:0;cursor:pointer;font:inherit;font-size:16px;font-weight:800;color:#1a1030;
 background:#ffd84d;padding:13px 24px;border-radius:999px}
#toast{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);z-index:8;display:none;
 background:rgba(20,8,30,.92);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px 18px;
 color:#fff;font-size:14px;line-height:1.5;text-align:center;max-width:360px;margin:0 auto}
#toast b{display:block;margin-bottom:6px;font-size:16px}
#toast button{margin-top:12px;border:0;cursor:pointer;font:inherit;font-weight:800;color:#1a1030;background:#ffd84d;
 padding:10px 20px;border-radius:999px}

/* Picture frame on the background wall (between window and hanging vines) */
#photoFrame{position:absolute;display:none;z-index:2;pointer-events:none;
 background:#8a5a2b;border-radius:4px;
 box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 3px #6b4420;
 padding:2.2%;}
#photoFrame .mat{width:100%;height:100%;background:#fdf6ec;padding:6%;
 box-shadow:inset 0 1px 4px rgba(0,0,0,.25);border-radius:2px}
#photoFrame img{width:100%;height:100%;object-fit:cover;display:block;border-radius:1px;background:#e8ddd0}
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const layer   = document.getElementById('panda-layer');
const hintEl  = document.getElementById('hint');
const toastEl = document.getElementById('toast');
const gateEl  = document.getElementById('gate');
const danceBtn= document.getElementById('dance');

function toast(title, msg, actionLabel, action){
  toastEl.innerHTML = '';
  const b = document.createElement('b'); b.textContent = title;
  const p = document.createElement('div'); p.textContent = msg;
  toastEl.append(b, p);
  if (actionLabel){
    const btn = document.createElement('button');
    btn.textContent = actionLabel;
    btn.onclick = () => { toastEl.style.display='none'; action && action(); };
    toastEl.append(btn);
  }
  toastEl.style.display = 'block';
}
const hideToast = () => { toastEl.style.display='none'; };

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const appEl = document.getElementById('app');
const vw = () => appEl.clientWidth || innerWidth;
const vh = () => appEl.clientHeight || innerHeight;
renderer.setSize(vw(), vh());
renderer.outputColorSpace = THREE.SRGBColorSpace;
layer.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, vw()/vh(), 0.01, 2000);

/* daytime lighting */
const hemi = new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2);
const key  = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(2,4,4);
const fill = new THREE.DirectionalLight(0xffffff, 0.9); fill.position.set(-3,2,-2);
scene.add(hemi, key, fill);

/* party lighting rig (intensity 0 until dance mode) */
const partyRig = new THREE.Group(); scene.add(partyRig);
const partyColors = [0xff3ea5, 0x2dd4ff, 0x8b5cf6, 0x7CFFB2];
const spots = partyColors.map((c,i)=>{
  const s = new THREE.SpotLight(c, 0, 30, THREE.MathUtils.degToRad(26), 0.55, 1.2);
  s.position.set(Math.cos(i/4*Math.PI*2)*3.2, 4.2, Math.sin(i/4*Math.PI*2)*3.2 + 1.5);
  s.target.position.set(0, 0.9, 0);
  partyRig.add(s, s.target);
  return s;
});
const partyAmbient = new THREE.AmbientLight(0x6a49ff, 0); partyRig.add(partyAmbient);

function relayout(){
  const w = vw(), h = vh();
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
  frameCamera();
}
let relayoutTimer = 0;
const scheduleRelayout = ()=>{ clearTimeout(relayoutTimer); relayoutTimer = setTimeout(relayout, 60); };
addEventListener('resize', scheduleRelayout);
addEventListener('orientationchange', ()=> setTimeout(relayout, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', scheduleRelayout);

/* ---------------- load embedded GLB ---------------- */
const glbURL = '/__l5e/assets-v1/576ad25a-4f76-4afd-a36f-d88b77c3ca9f/panda.glb';

const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
draco.setDecoderConfig({ type:'js' });
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

/* true posed bounds from skinned vertices */
function meshBox(root){
  const b = new THREE.Box3(), v = new THREE.Vector3();
  let sampled = 0;
  root.updateWorldMatrix(true, true);
  root.traverse(o=>{ if(o.isSkinnedMesh && o.skeleton) o.skeleton.update(); });
  root.traverse(o=>{
    if(!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
    if(typeof o.getVertexPosition !== 'function') return;
    const n = o.geometry.attributes.position.count;
    const step = Math.max(1, Math.floor(n/4000));
    for(let i=0;i<n;i+=step){
      o.getVertexPosition(i, v);
      if(!o.isSkinnedMesh) v.applyMatrix4(o.matrixWorld);
      b.expandByPoint(v); sampled++;
    }
  });
  if (sampled) return b;
  root.traverse(o=>{ if(o.isBone){ o.getWorldPosition(v); b.expandByPoint(v); }});
  return b;
}

let mixer=null, idleAction=null, panda=null, modelScale=1.6;
let headBone=null, hipsBone=null, spineBone=null;
let armL=null, armR=null, foreL=null, foreR=null;
const rest = new Map();
function remember(bone){ if(bone && !rest.has(bone)) rest.set(bone, bone.quaternion.clone()); }

loader.load(glbURL, (gltf)=>{
  panda = gltf.scene;
  window.__panda = panda;
  scene.add(panda);
  panda.traverse(o=>{ if(o.isMesh){ o.frustumCulled=false; if(o.material) o.material.side = THREE.FrontSide; } });

  const get = n => panda.getObjectByName(n);
  headBone = get('mixamorigHead') || get('mixamorigNeck');
  hipsBone = get('mixamorigHips');
  spineBone= get('mixamorigSpine1') || get('mixamorigSpine');
  armL = get('mixamorigLeftArm');  foreL = get('mixamorigLeftForeArm');
  armR = get('mixamorigRightArm'); foreR = get('mixamorigRightForeArm');

  mixer = new THREE.AnimationMixer(panda);
  const clips = gltf.animations || [];
  const dance = clips.find(c=>/dance/i.test(c.name));
  const idle  = clips.find(c=>/idle/i.test(c.name)) || clips[0];
  if (idle){ idleAction = mixer.clipAction(idle); idleAction.play(); }
  if (dance){ danceAction = mixer.clipAction(dance); danceAction.setLoop(THREE.LoopRepeat, Infinity); }
  mixer.update(0);

  [headBone,hipsBone,spineBone,armL,armR,foreL,foreR].forEach(remember);

  /* upright: kill any inherited tilt on the root, normalize height, plant feet */
  panda.rotation.set(0, 0, 0);
  const size = new THREE.Vector3();
  for (let i=0;i<8;i++){
    panda.updateWorldMatrix(true,true);
    meshBox(panda).getSize(size);
    const k = 1.6 / Math.max(size.y, 1e-6);
    if (Math.abs(k-1) < 0.004) break;
    panda.scale.multiplyScalar(k);
  }
  modelScale = 1.6;
  for (let i=0;i<3;i++){
    panda.updateWorldMatrix(true,true);
    const box = meshBox(panda);
    const c = new THREE.Vector3(); box.getCenter(c);
    panda.position.x -= c.x;
    panda.position.z -= c.z;
    panda.position.y -= box.min.y;   // feet exactly on the floor plane y = 0
  }
  /* --- upright correction: make the hips->head spine axis truly vertical --- */
  if (hipsBone && headBone){
    const hp = new THREE.Vector3(), hd = new THREE.Vector3();
    for (let i=0;i<4;i++){
      panda.updateWorldMatrix(true,true);
      hipsBone.getWorldPosition(hp); headBone.getWorldPosition(hd);
      const axis = hd.sub(hp).normalize();
      if (!isFinite(axis.x)) break;
      const fix = new THREE.Quaternion().setFromUnitVectors(axis, new THREE.Vector3(0,1,0));
      const ang = 2*Math.acos(Math.min(1,Math.abs(fix.w)));
      if (ang < 0.005) break;
      panda.quaternion.premultiply(fix);
    }
    // keep the panda facing the camera: no yaw introduced by the fix
    const e = new THREE.Euler().setFromQuaternion(panda.quaternion, 'YXZ');
    e.y = 0;
    panda.quaternion.setFromEuler(e);
  }
  /* re-plant both feet on the floor line after straightening */
  for (let i=0;i<3;i++){
    panda.updateWorldMatrix(true,true);
    const box = meshBox(panda);
    const c = new THREE.Vector3(); box.getCenter(c);
    panda.position.x -= c.x;
    panda.position.z -= c.z;
    panda.position.y -= box.min.y;
  }
  panda.userData.uprightQ = panda.quaternion.clone();
  panda.userData.baseY = panda.position.y;
  {
    /* torso radius measured from the shoulder bones (the bbox includes the arm span) */
    panda.updateWorldMatrix(true, true);
    const a = new THREE.Vector3(), b2 = new THREE.Vector3();
    let half = 0;
    if (armL && armR){ armL.getWorldPosition(a); armR.getWorldPosition(b2); half = Math.abs(a.x - b2.x) * 0.5; }
    if (!(half > 0.01)){ const bb = meshBox(panda), bs = new THREE.Vector3(); bb.getSize(bs); half = bs.x*0.18; }
    panda.userData.shoulderHalf = half;
    panda.userData.torsoClearR = half * 0.95;   // hands must stay outside this cylinder
  }



  frameCamera();
  hintEl.textContent = 'Say something — Panda repeats it!';
}, undefined, (e)=> toast('Model failed to load', String(e && e.message ? e.message : e)));

/* ---------------- camera framing ----------------
   Feet sit on y = 0; the panda fills FILL of the screen height with its feet
   at FEET_AT down the screen, matching the courtyard floor line. */
const FILL = 0.46;      // full body visible with breathing room
const FEET_AT = 0.82;
const camBase = new THREE.Vector3();
let camLookY = 0;
function frameCamera(){
  if(!panda) return;
  const box = meshBox(panda);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  if (hipsBone){ const hp = new THREE.Vector3(); hipsBone.getWorldPosition(hp); center.x = hp.x; }
  const feetY = box.min.y;
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov*0.5));

  let viewH = size.y / FILL;
  const viewHfromW = (size.x / 0.72) / camera.aspect;  // never clip arms on narrow phones
  viewH = Math.max(viewH, viewHfromW);

  const dist = viewH / (2*tan);
  const camY = feetY + viewH * (FEET_AT - 0.5);
  camBase.set(center.x, camY, dist);
  camLookY = camY;
  camera.position.copy(camBase);
  camera.lookAt(center.x, camY, 0);   // level camera => no keystoning, feet stay planted
  camera.updateProjectionMatrix();
}

/* ---------------- microphone: permission -> listen -> repeat ---------------- */
let audioCtx=null, micAnalyser=null, playAnalyser=null, activeAnalyser=null;
let recorder=null, chunks=[], recording=false, playing=false, silenceStart=0;
let micReady=false;

function ensureCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx.resume().then(()=>audioCtx);
}

function micErrorMessage(err){
  const n = err && (err.name || err.code) || '';
  if (n === 'NotAllowedError' || n === 'PermissionDeniedError' || n === 'SecurityError')
    return 'Microphone permission was blocked. Open your browser settings for this page (tap the lock / ⓘ icon in the address bar), allow Microphone, then tap Try again.';
  if (n === 'NotFoundError' || n === 'DevicesNotFoundError')
    return 'No microphone was found on this device.';
  if (n === 'NotReadableError' || n === 'TrackStartError')
    return 'Another app is already using the microphone. Close it and tap Try again.';
  if (!window.isSecureContext)
    return 'Microphone needs a secure page (https). Open this app over https and try again.';
  return (err && err.message) ? err.message : 'Microphone could not be started.';
}

async function requestMic(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw Object.assign(new Error('This browser does not support microphone access.'), { name:'Unsupported' });

  // Pre-check the permission state so a previously blocked mic gives a clear message.
  try {
    if (navigator.permissions && navigator.permissions.query){
      const st = await navigator.permissions.query({ name:'microphone' });
      if (st.state === 'denied') throw Object.assign(new Error('denied'), { name:'NotAllowedError' });
    }
  } catch(e){ if (e && e.name === 'NotAllowedError') throw e; /* query unsupported: continue */ }

  return navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
}

async function startAudio(){
  await ensureCtx();
  const stream = await requestMic();

  const src = audioCtx.createMediaStreamSource(stream);
  micAnalyser = audioCtx.createAnalyser();
  micAnalyser.fftSize = 1024; micAnalyser.smoothingTimeConstant = 0.6;
  src.connect(micAnalyser);

  /* raw PCM tap used to record the actual voice */
  const proc = audioCtx.createScriptProcessor(2048, 1, 1);
  proc.onaudioprocess = (ev)=>{
    try { onMicBlock(new Float32Array(ev.inputBuffer.getChannelData(0))); } catch(e){}
  };
  src.connect(proc);
  const mute = audioCtx.createGain(); mute.gain.value = 0;
  proc.connect(mute); mute.connect(audioCtx.destination);   // keep the node alive, silent

  capture = { stream, src, proc };
  recorder = capture;
  activeAnalyser = micAnalyser;
  micReady = true;
  listening = true;
  resetCapture();
  hideToast();

  hintEl.textContent = 'Say something — Panda repeats it!';
}


/* ---------------- audio repeat: record the real voice, replay it as a cute baby panda ----------------
   No speech-to-text, no synthesised voice. The raw microphone audio is captured into a
   buffer (with a pre-roll so the first syllable is never clipped and a natural tail so the
   ending is kept), pitch-shifted up, then played straight back. */
let capture = null;                    // { stream, src, proc }
let listening = true;                  // paused while the panda talks or dances

const DETUNE_CENTS = 250;              // simple pitch lift for a cute baby voice (no speed change)
const REPLAY_GAIN  = 1.35;             // slightly louder playback
const PRE_ROLL_SEC  = 0.6;             // audio kept from *before* speech was detected
const SILENCE_MS    = 750;             // how long a pause ends the phrase
const MIN_SPEECH_MS = 250;             // ignore coughs/clicks
const MAX_PHRASE_SEC= 15;

let preRoll = [], preLen = 0;
let recChunks = [], recLen = 0;
let speechOn = false, speechStart = 0, lastVoice = 0, noiseFloor = 0.008;

function pushPreRoll(block, maxLen){
  preRoll.push(block); preLen += block.length;
  while (preLen - preRoll[0].length > maxLen){ preLen -= preRoll[0].length; preRoll.shift(); }
}
function resetCapture(){ preRoll = []; preLen = 0; recChunks = []; recLen = 0; speechOn = false; }

function onMicBlock(block){
  const sr = audioCtx.sampleRate;
  let sum = 0;
  for (let i=0;i<block.length;i++){ const v = block[i]; sum += v*v; }
  const rms = Math.sqrt(sum/block.length);
  const now = performance.now();

  if (!listening || playing || partyMode){ resetCapture(); return; }

  const thresh = Math.max(0.012, noiseFloor * 3);
  const voiced = rms > thresh;

  if (!speechOn){
    noiseFloor = noiseFloor*0.95 + rms*0.05;
    pushPreRoll(block, Math.floor(PRE_ROLL_SEC * sr));
    if (voiced){
      speechOn = true; speechStart = now; lastVoice = now;
      recChunks = preRoll.slice(); recLen = preLen;      // keep the pre-roll: no clipped start
      preRoll = []; preLen = 0;
      hintEl.textContent = 'Listening… 🎙️';
    }
    return;
  }

  recChunks.push(block); recLen += block.length;
  if (voiced) lastVoice = now;

  const longEnough = now - speechStart > MIN_SPEECH_MS;
  const silentLongEnough = now - lastVoice > SILENCE_MS;   // trailing audio stays in the buffer
  if ((silentLongEnough && longEnough) || recLen > MAX_PHRASE_SEC * sr){
    const audio = new Float32Array(recLen);
    let off = 0;
    for (const c of recChunks){ audio.set(c, off); off += c.length; }
    resetCapture();
    pandaRepeatAudio(audio);
  } else if (silentLongEnough){
    resetCapture();                                        // too short: discard
  }
}


/* replay the user's own recording, pitched up into a cute baby-panda voice */
function pandaRepeatAudio(samples){
  if (!audioCtx || partyMode || !samples.length) return;
  const buf = audioCtx.createBuffer(1, samples.length, audioCtx.sampleRate);
  buf.copyToChannel(samples, 0);

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.detune.value = DETUNE_CENTS;          // simple, clean pitch-up for baby voice
  const gain = audioCtx.createGain(); gain.gain.value = REPLAY_GAIN;
  if (!playAnalyser){
    playAnalyser = audioCtx.createAnalyser();
    playAnalyser.fftSize = 1024; playAnalyser.smoothingTimeConstant = 0.6;
  }
  src.connect(gain); gain.connect(playAnalyser); gain.connect(audioCtx.destination);

  playing = true;
  activeAnalyser = playAnalyser;
  talkUntil = performance.now() + buf.duration*1000 + 200;
  hintEl.textContent = 'Panda is repeating you! 🐼';

  const done = ()=>{
    playing = false;
    activeAnalyser = micAnalyser;
    resetCapture();
    if (!partyMode) hintEl.textContent = 'Say something — Panda repeats it!';
  };
  src.onended = done;
  try { src.start(); } catch(e){ done(); }
}

async function tryStartAudio(){
  try { await startAudio(); }
  catch(err){
    micReady = false;
    hintEl.textContent = 'Microphone is off';
    toast('Microphone needed', micErrorMessage(err), 'Try again', tryStartAudio);
  }
}

function levelOf(an){
  if(!an) return 0;
  const buf = new Uint8Array(an.fftSize);
  an.getByteTimeDomainData(buf);
  let sum=0;
  for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; }
  return Math.sqrt(sum/buf.length);
}

function pauseRecognition(){ listening = false; resetCapture(); }
function resumeRecognition(){ listening = true; resetCapture(); }
function stopListening(discard){ if (discard) pauseRecognition(); }
function vad(){ /* capture is handled in the audio processing callback */ }

/* ---------------- dance mode: music + choreography + party scene ---------------- */
let danceAction = null;
let partyMode = false, partyBlend = 0, musicStop = null, danceTime = 0;

/* upbeat loop synthesised with WebAudio (no external files, instant + offline) */
function startMusic(){
  const ctx = audioCtx;
  const bus = ctx.createGain(); bus.gain.value = 0; bus.connect(ctx.destination);
  bus.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.8);

  const BPM = 124, beat = 60/BPM;
  let step = 0, next = ctx.currentTime + 0.1;
  const scale = [0,3,5,7,10,12,15,14];
  const root = 110; // A2
  const bassPat = [0,0,7,0,5,5,3,3];

  function kick(t){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.26);
  }
  function hat(t, open){
    const len = open?0.14:0.045;
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate*len), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=ctx.createBufferSource(); s.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
    const g=ctx.createGain(); g.gain.value=open?0.22:0.16;
    s.connect(f); f.connect(g); g.connect(bus); s.start(t);
  }
  function bass(t, semi){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value = root*Math.pow(2,semi/12);
    f.type='lowpass'; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(240,t+beat*0.5);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+beat*0.55);
    o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t+beat*0.6);
  }
  function lead(t, semi){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle'; o.frequency.value = root*4*Math.pow(2,semi/12);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+beat*0.45);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+beat*0.5);
  }

  const timer = setInterval(()=>{
    while (next < ctx.currentTime + 0.2){
      const s = step % 8, bar = Math.floor(step/8);
      if (s%2===0) kick(next);
      hat(next, s===6);
      bass(next, bassPat[s]);
      if (bar % 2 === 1) lead(next, scale[(step + bar) % scale.length]);
      next += beat/2; step++;
    }
  }, 40);

  return () => {
    clearInterval(timer);
    const t = ctx.currentTime;
    bus.gain.cancelScheduledValues(t);
    bus.gain.setValueAtTime(bus.gain.value, t);
    bus.gain.linearRampToValueAtTime(0.0001, t + 0.5);
    setTimeout(()=>{ try{ bus.disconnect(); }catch(e){} }, 800);
  };
}

async function toggleDance(){
  await ensureCtx();

  hintEl.textContent = partyMode

  } else {

  }
}

/* ---------------- gangster dance outfit (chain + shades), only while dancing ---------------- */
let swagGroup = null, swagParts = null;
function buildSwag(){
  if (swagGroup || !panda) return;
  const box = new THREE.Box3().setFromObject(panda);   // real world-space size
  const H = Math.max(0.001, box.max.y - box.min.y);
  if (H > 20) return;                                   // model not scaled/placed yet

  const neck = bone('mixamorigNeck') || bone('mixamorigSpine2') || spineBone;
  const head = headBone || neck;

  const gold = new THREE.MeshStandardMaterial({ color:0xf2c14e, roughness:0.25, metalness:1.0 });
  const black= new THREE.MeshStandardMaterial({ color:0x08080a, roughness:0.12, metalness:0.7 });
  const dark = new THREE.MeshStandardMaterial({ color:0x101014, roughness:0.35, metalness:0.5 });

  const torsoR = (panda.userData.shoulderHalf || H*0.11) * 1.05;

  const linkGeo = new THREE.TorusGeometry(H*0.014, H*0.0055, 6, 12);
  const SPAN = 1.85;                                   // radians, left shoulder -> front -> right
  const N = 24;
  const DROP = H*0.085;
  for (let i=0;i<=N;i++){
    const a = -SPAN + (i/N)*SPAN*2;                    // -SPAN .. +SPAN, 0 = straight ahead
    const drop = -DROP * Math.cos(a*(Math.PI/2)/SPAN);
    const l = new THREE.Mesh(linkGeo, gold);
    l.position.set(Math.sin(a)*Rx, drop, Math.cos(a)*Rz);
    l.lookAt(l.position.x*2, l.position.y, l.position.z*2);
    l.rotateX(Math.PI/2);
    chain.add(l);
  }
  const frontY = -DROP, frontZ = Rz;
  const pend = new THREE.Mesh(new THREE.TorusGeometry(H*0.036, H*0.012, 8, 18), gold);
  pend.position.set(0, frontY - H*0.035, frontZ + H*0.006);
  chain.add(pend);
  const dollar = new THREE.Mesh(new THREE.BoxGeometry(H*0.012, H*0.05, H*0.012), gold);
  dollar.position.copy(pend.position); dollar.position.z += H*0.012;

  const shades = new THREE.Group();
  const gloss = new THREE.MeshStandardMaterial({ color:0x050507, roughness:0.08, metalness:0.35 });
  const LR = H*0.085;                                   // lens radius (pre-squash)
  const GAP = H*0.092;                                  // half distance between lens centres
  const mkLens = (sign)=>{
    const g = new THREE.Group();
    // lens: squashed dark glass disc, wayfarer-ish oval
    const lens = new THREE.Mesh(new THREE.CylinderGeometry(LR, LR*0.94, H*0.020, 24), black);
    lens.rotation.x = Math.PI/2;                        // face forward
    lens.scale.set(1, 1, 1);                            // depth along z after rotation
    lens.scale.y = 1;
    const lensHolder = new THREE.Group();
    lensHolder.add(lens);
    lensHolder.scale.set(1.0, 0.78, 1.0);               // oval: wider than tall
    g.add(lensHolder);
    // frame ring around the lens
    const rim = new THREE.Mesh(new THREE.TorusGeometry(LR*1.0, H*0.011, 10, 28), gloss);
    rim.scale.set(1.0, 0.78, 1.0);
    rim.position.z = H*0.004;
    g.add(rim);
    // outer hinge nub where the temple arm attaches
    const hinge = new THREE.Mesh(new THREE.BoxGeometry(H*0.020, H*0.030, H*0.024), gloss);
    hinge.position.set(sign*(LR*1.02), H*0.012, 0);
    g.add(hinge);
    g.position.set(sign*GAP, 0, 0);
    g.rotation.y = -sign*0.14;                          // slight wrap around the face
    return g;
  };
  // center bridge linking the two frames
  const bridge = new THREE.Mesh(new THREE.CylinderGeometry(H*0.009, H*0.009, GAP*2 - LR*1.7, 10), gloss);
  bridge.rotation.z = Math.PI/2;
  bridge.position.y = H*0.010;
  // brow bar across the top for the DJ look
  const brow = new THREE.Mesh(new THREE.CylinderGeometry(H*0.010, H*0.010, GAP*2 + LR*1.1, 10), gloss);
  brow.rotation.z = Math.PI/2;
  brow.position.y = LR*0.78 + H*0.006;
  // temple arms running back toward the ears
  const templeGeo = new THREE.BoxGeometry(H*0.018, H*0.022, H*0.22);
  const tL = new THREE.Mesh(templeGeo, gloss);
  tL.position.set(-(GAP + LR*1.02), H*0.012, -H*0.11);
  const tR = tL.clone(); tR.position.x = (GAP + LR*1.02);
  shades.add(mkLens(-1), mkLens(1), bridge, brow, tL, tR);

  /* park both pieces in world space, then parent them to the rig so they are
     welded to the body and can never float or drift during the dance */
  const wq = panda.getWorldQuaternion(new THREE.Quaternion());
  const fwd = new THREE.Vector3(0,0,1).applyQuaternion(wq).setY(0).normalize();

  chain.position.copy(wp).add(new THREE.Vector3(0, -H*0.005, 0));
  chain.quaternion.copy(wq);

  head.getWorldPosition(wp);
  shades.position.copy(wp).addScaledVector(fwd, H*0.190).add(new THREE.Vector3(0, H*0.155, 0));
  shades.quaternion.copy(wq);

  neck.attach(chain);                                   // keeps world transform, now rig-driven
  head.attach(shades);

  chain.visible = false; shades.visible = false;
  swagParts = { chain, shades, H, gold, torsoR };
}

/* the outfit rides the rig now — only its visibility / fade is driven per frame */
function updateSwag(amount){
  if (!swagParts) return;
  const s = Math.min(1, Math.max(0, amount));
  const on = s > 0.02;
  swagParts.chain.visible = on;
  swagParts.shades.visible = on;
